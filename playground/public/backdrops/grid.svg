<svg
  height="1000"
  viewBox="0 0 1600 1000"
  width="1600"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Grid</title>

  <defs>
    <pattern height="80" id="checker" patternUnits="userSpaceOnUse" width="80">
      <rect fill="#f2f2f2" height="80" width="80" />

      <rect fill="#d9d9de" height="40" width="40" />

      <rect fill="#d9d9de" height="40" width="40" x="40" y="40" />
    </pattern>

    <pattern height="40" id="lines" patternUnits="userSpaceOnUse" width="40">
      <path
        d="M40 0H0V40"
        fill="none"
        stroke="#5b5bd6"
        stroke-opacity="0.35"
        stroke-width="1"
      />
    </pattern>
  </defs>

  <rect fill="url(#checker)" height="1000" width="1600" />

  <rect fill="url(#lines)" height="1000" width="1600" />

  <g fill="none" stroke-width="10">
    <circle cx="420" cy="500" r="300" stroke="#e5484d" />

    <circle cx="420" cy="500" r="220" stroke="#f76b15" />

    <circle cx="420" cy="500" r="140" stroke="#ffc53d" />

    <circle cx="420" cy="500" r="60" stroke="#30a46c" />

    <circle cx="1180" cy="500" r="300" stroke="#0090ff" />

    <circle cx="1180" cy="500" r="220" stroke="#8e4ec6" />

    <circle cx="1180" cy="500" r="140" stroke="#d6409f" />

    <circle cx="1180" cy="500" r="60" stroke="#12a594" />
  </g>

  <g stroke="#111" stroke-width="4">
    <line x1="0" x2="1600" y1="500" y2="500" />

    <line x1="800" x2="800" y1="0" y2="1000" />
  </g>
</svg>
