<svg
  height="1000"
  viewBox="0 0 1600 1000"
  width="1600"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Typography</title>

  <rect fill="#f5f1e8" height="1000" width="1600" />

  <g fill="#141414" font-family="Georgia, serif">
    <text font-size="210" font-weight="700" x="60" y="230">Refraction</text>

    <text font-size="210" font-style="italic" x="60" y="450">bends light</text>

    <text fill="#e4572e" font-size="210" font-weight="700" x="60" y="670">
      through glass.
    </text>
  </g>

  <g fill="#3a3a3a" font-family="system-ui, sans-serif" font-size="30">
    <text x="64" y="760">
      Every surface you place here samples the pixels behind it and shifts them
      along the edge.
    </text>

    <text x="64" y="810">
      Thin lines, small letters and sharp corners show how smooth the
      displacement really is.
    </text>

    <text x="64" y="860">
      Move the glass across this paragraph to compare WebGL and the SVG filter
      side by side.
    </text>

    <text x="64" y="910">
      ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789
      !?&amp;@#%
    </text>
  </g>

  <g stroke="#141414" stroke-width="2">
    <line x1="1220" x2="1540" y1="80" y2="80" />

    <line x1="1220" x2="1540" y1="100" y2="100" />

    <line x1="1220" x2="1540" y1="120" y2="120" />

    <line x1="1220" x2="1540" y1="140" y2="140" />
  </g>
</svg>
