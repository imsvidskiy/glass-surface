<svg
  height="1000"
  viewBox="0 0 1600 1000"
  width="1600"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Aurora</title>

  <defs>
    <filter height="200%" id="soft" width="200%" x="-50%" y="-50%">
      <feGaussianBlur stdDeviation="90" />
    </filter>

    <pattern height="140" id="stars" patternUnits="userSpaceOnUse" width="140">
      <circle cx="20" cy="30" fill="#fff" fill-opacity="0.8" r="1.6" />

      <circle cx="90" cy="70" fill="#fff" fill-opacity="0.5" r="1.2" />

      <circle cx="60" cy="120" fill="#fff" fill-opacity="0.7" r="1.4" />

      <circle cx="120" cy="15" fill="#fff" fill-opacity="0.4" r="1" />
    </pattern>
  </defs>

  <rect fill="#070b1f" height="1000" width="1600" />

  <rect fill="url(#stars)" height="1000" width="1600" />

  <g filter="url(#soft)">
    <ellipse cx="380" cy="360" fill="#22d3ee" rx="360" ry="200" />

    <ellipse cx="820" cy="520" fill="#a855f7" rx="420" ry="230" />

    <ellipse cx="1260" cy="380" fill="#f472b6" rx="340" ry="210" />

    <ellipse cx="980" cy="820" fill="#34d399" rx="380" ry="150" />
  </g>

  <text
    fill="#fff"
    fill-opacity="0.9"
    font-family="system-ui, sans-serif"
    font-size="96"
    font-weight="700"
    text-anchor="middle"
    x="800"
    y="540"
  >
    Northern lights
  </text>
</svg>
