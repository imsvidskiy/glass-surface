<svg
  height="1000"
  viewBox="0 0 1600 1000"
  width="1600"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Backdrop</title>

  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8" />

      <stop offset="0.5" stop-color="#9333ea" />

      <stop offset="1" stop-color="#f97316" />
    </linearGradient>

    <pattern
      height="80"
      id="stripes"
      patternTransform="rotate(30)"
      patternUnits="userSpaceOnUse"
      width="80"
    >
      <rect fill="#ffffff" fill-opacity="0.12" height="80" width="40" />
    </pattern>
  </defs>

  <rect fill="url(#sky)" height="1000" width="1600" />

  <rect fill="url(#stripes)" height="1000" width="1600" />

  <circle cx="380" cy="420" fill="#facc15" r="220" />

  <circle cx="1220" cy="560" fill="#22d3ee" r="260" />

  <rect fill="#f43f5e" height="360" rx="48" width="360" x="620" y="260" />

  <text
    fill="#ffffff"
    font-family="system-ui, sans-serif"
    font-size="140"
    font-weight="800"
    text-anchor="middle"
    x="800"
    y="880"
  >
    GLASS
  </text>
</svg>
