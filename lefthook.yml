$schema: https://raw.githubusercontent.com/evilmartians/lefthook/v2.2.2/schema.json

glob_matcher: doublestar

pre-commit:
  jobs:
    - name: ultracite
      run: bun x --no-install ultracite fix {staged_files}
      glob: "**/*.{css,html,json,jsonc,md,ts,tsx,yml}"
      stage_fixed: true

pre-push:
  piped: true
  jobs:
    - name: build
      run: bun run build

    - name: typecheck
      run: bun run typecheck

    - name: test
      run: bun run test
