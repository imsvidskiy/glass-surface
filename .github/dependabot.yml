# yaml-language-server: $schema=https://www.schemastore.org/dependabot-2.0.json
version: 2

updates:
  - commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
    directory: /
    groups:
      bun-minor-patch:
        patterns: [ "*" ]
        update-types: [ minor, patch ]
    package-ecosystem: bun
    schedule:
      interval: weekly

  - commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 3
    directory: /
    groups:
      github-actions:
        patterns: [ "*" ]
    package-ecosystem: github-actions
    schedule:
      interval: weekly
