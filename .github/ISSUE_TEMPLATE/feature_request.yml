# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: Feature request
description: Propose an option, a renderer improvement, or a framework adapter
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution.
  - type: textarea
    attributes:
      label: Problem
      description: What are you trying to achieve, and what stops you today?
      placeholder: I want the glass to refract a live DOM backdrop in Safari.
    id: problem
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposal
      description: How the library could solve it, such as a new option, a renderer change, or an adapter for another framework.
    id: proposal
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: Workarounds you tried or other designs you considered.
    id: alternatives
  - type: dropdown
    attributes:
      label: Package
      multiple: true
      options:
        - "@imsvidskiy/glass-surface"
        - "@imsvidskiy/glass-surface-react"
        - Playground
        - New adapter

    id: package
