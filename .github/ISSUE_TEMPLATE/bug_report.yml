name: Bug report
description: The surface does not render or behave as documented
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The package version, the renderer and the browser make most bugs reproducible on the first try. Security problems go through [private vulnerability reporting](https://github.com/svidskiy/glass-surface/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
      placeholder: A shaped surface lost its outline after the window was resized.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The options you pass, or a link to a minimal reproduction.
      placeholder: |
        1. Render <GlassSurface shape="/star.svg" />
        2. Resize the window
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "@svidskiy/glass-surface-react 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options:
        - "@svidskiy/glass-surface"
        - "@svidskiy/glass-surface-react"
        - Playground
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - WebGL
        - SVG
        - Fallback
        - Unsure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on macOS 27
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: What the surface looks like, if it renders at all.
